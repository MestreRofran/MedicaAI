/* MedicaAI 1.3 — linguagem visual moderna. O estilo clássico permanece intacto. */
body[data-ui-style="modern"]{
  --background:#f1f6f8;--surface:#ffffff;--surface2:#f5f9fa;
  --text:#1b333e;--muted:#69808b;--line:#dfebee;
  --green:#168461;--red:#df5d66;--amber:#b97722;
  --shadow:0 8px 28px rgba(21,60,78,.045),0 1px 3px rgba(21,60,78,.035);
  --modern-soft:color-mix(in srgb,var(--accent) 7%,var(--surface));
  --modern-strong:color-mix(in srgb,var(--accent) 14%,var(--surface));
  font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
body[data-ui-style="modern"][data-theme="dark"]{
  --background:#0e1921;--surface:#17262f;--surface2:#20343e;
  --text:#e7f2f4;--muted:#a6bac4;--line:#334b55;
  --green:#66d9ad;--red:#ff979a;--amber:#efc17e;
  --shadow:0 9px 30px rgba(0,0,0,.13);
  --modern-soft:color-mix(in srgb,var(--accent) 11%,var(--surface));
  --modern-strong:color-mix(in srgb,var(--accent) 20%,var(--surface));
}
body[data-ui-style="modern"] .main{
  padding:16px clamp(17px,3.2vw,38px) 32px;
  background:radial-gradient(ellipse 1100px 450px at 85% -10%,color-mix(in srgb,var(--accent) 6%,transparent),transparent 78%),var(--background);
  scroll-behavior:smooth;
}
body[data-ui-style="modern"] .page{width:min(1160px,100%);animation:medicaReveal .22s cubic-bezier(.2,.7,.3,1)}
@keyframes medicaReveal{from{opacity:.5;transform:translateY(7px)}to{opacity:1;transform:none}}
body[data-ui-style="modern"] .sidebar{
  background:var(--surface);border-right:1px solid var(--line);box-shadow:2px 0 18px rgba(20,49,59,.018);
}
body[data-ui-style="modern"] .brand{padding:27px 19px 22px;gap:12px;border-color:var(--line)}
body[data-ui-style="modern"] .brand img{width:46px;height:46px;border-radius:15px;box-shadow:0 4px 13px rgba(5,79,93,.14)}
body[data-ui-style="modern"] .brand-title{font-size:21px;letter-spacing:-.85px;font-weight:850;color:var(--text)}
body[data-ui-style="modern"] .brand-sub{font-size:11px;letter-spacing:.08px;margin-top:3px}
body[data-ui-style="modern"] .navlist{padding:18px 12px;scrollbar-width:thin}
body[data-ui-style="modern"] .navitem{
  gap:12px;min-height:46px;margin:3px 0;padding:11px 13px;border-radius:13px;
  font-size:13.5px;font-weight:640;color:var(--muted);transition:background .16s,color .16s,transform .16s;
}
body[data-ui-style="modern"] .navitem:hover{background:var(--surface2);color:var(--text);transform:translateX(2px)}
body[data-ui-style="modern"] .navitem.active{
  background:var(--modern-soft);color:var(--accent);font-weight:800;
  box-shadow:inset 3px 0 0 var(--accent)
}
body[data-ui-style="modern"] .nav-emoji{font-size:19px;width:26px;filter:saturate(.85)}
body[data-ui-style="modern"] .sidefoot{border-color:var(--line);padding:15px 19px;line-height:1.5;font-size:11px}
body[data-ui-style="modern"] .topbar{
  height:76px;flex:0 0 76px;background:var(--surface);border-bottom:1px solid var(--line);
  padding:0 clamp(16px,2.8vw,34px);gap:14px;box-shadow:0 2px 13px rgba(23,58,71,.025)
}
body[data-ui-style="modern"] .top-brand{
  font-size:25px;line-height:1.1;letter-spacing:-1.15px;font-weight:900;
  color:var(--text);display:inline-flex;align-items:center;gap:0;padding:8px 1px;
  border:0;border-radius:10px;background:none;cursor:pointer;
}

function applySettings(){const body=document.body;body.dataset.theme=isDark()?'dark':'light';body.dataset.uiStyle=db.settings.uiStyle==='classic'?'classic':'modern';body.dataset.density=db.settings.density;body.dataset.bottomNav=String(db.settings.bottomNav);document.documentElement.style.setProperty('--accent',db.settings.accent);document.querySelector('meta[name="theme-color"]').content=isDark()?'#18232e':db.settings.accent}
const viewHistory=[];let lastBackPress=0;
function rememberView(){viewHistory.push({route,tab:{...tab},month,year,selectedDay,editCadastro});if(viewHistory.length>80)viewHistory.shift()}
function showMenu(v){$('#sidebar').classList.toggle('open',v);$('#backdrop').classList.toggle('show',v)}
function go(id,options={}){if(!NAV.some(n=>n[0]===id))return;if(id!==route&&!options.noHistory)rememberView();route=id;lastBackPress=0;closeModal();showMenu(false);$('#main').scrollTop=0;render()}

function back(){if($('#modalWrap').classList.contains('show')){closeModal();return true}if($('#sidebar').classList.contains('open')){showMenu(false);return true}if(route==='cadastros'&&editCadastro){editCadastro=false;render();return true}if(viewHistory.length){const p=viewHistory.pop();route=p.route;tab={...p.tab};month=p.month;year=p.year;selectedDay=p.selectedDay;editCadastro=p.editCadastro;$('#main').scrollTop=0;render();return true}if(route!=='inicio'){go('inicio',{noHistory:true});return true}return false}
function modal(title,html,after){$('#modal').innerHTML=`<div class="modalhead"><h2 id="modalTitle">${E(title)}</h2><button type="button" class="btn ghost small" data-action="close">✕ Fechar</button></div>${html}`;$('#modalWrap').classList.add('show');if(after)after();/* Evita abrir o teclado automaticamente ao abrir um modal no Android. */}
function closeModal(){$('#modalWrap').classList.remove('show');$('#modal').innerHTML=''}function label(t,control,cls=''){return `<label class="field ${cls}">${t}${control}</label>`}
function inp(name,value='',type='text',req=''){return `<input name="${name}" type="${type}" value="${E(value)}" ${req}>`}function area(name,v=''){return `<textarea name="${name}">${E(v)}</textarea>`}function select(name,items,val){return `<select name="${name}">${items.map(([v,t])=>`<option value="${E(v)}" ${String(v)===String(val)?'selected':''}>${E(t)}</option>`).join('')}</select>`}
function formsave(e,fn){e.preventDefault();const fd=Object.fromEntries(new FormData(e.currentTarget));fn(fd,e.currentTarget)}
function render(){applySettings();document.body.dataset.route=route;document.body.dataset.plusStyle=db.settings.plusStyle;$('#avatar').textContent=profile().emoji||'👤';$('#profileName').textContent=shortName(profile().name);$('#profileName').title=profile().name;
$('#navlist').innerHTML=orderedNav().map(n=>`<button type="button" class="navitem ${n[0]===route?'active':''}" data-go="${n[0]}"><span class="nav-emoji">${n[1]}</span>${n[2]}</button>`).join('');
$('#footnav').innerHTML=['inicio','calendario','consultas','medicamentos','cadastros'].map(id=>NAV.find(n=>n[0]===id)).map(n=>`<button data-go="${n[0]}" class="${route===n[0]?'active':''}"><span>${n[1]}</span>${n[2]}</button>`).join('');
const renderer={inicio:home,calendario:calendar,consultas:consultations,medicamentos:medications,historico:historyPage,cadastros:registrations,config:settings,conexao:connectionPage,info:information};$('#page').innerHTML=renderer[route]();$('#page').dataset.renderedRoute=route;restorePanels();const fab=$('#sectionFab');if(fab){const section=route==='consultas'||route==='medicamentos';const action=route==='consultas'?'appt-new':'med-new';const style=route==='consultas'?db.settings.consultPlusStyle:db.settings.medPlusStyle;fab.dataset.action=action;fab.setAttribute('aria-label',route==='consultas'?'Adicionar consulta':'Adicionar remédio');fab.setAttribute('title',route==='consultas'?'Adicionar consulta':'Adicionar remédio');fab.classList.toggle('outline',style==='bottom-outline');document.body.dataset.sectionPlusStyle=section?style:'none'}}
function activeAppt(a){return a.status==='agendada'}function apSort(a,b){return (a.date+'T'+a.time).localeCompare(b.date+'T'+b.time)}function doseKey(m,day,time){return m.id+'|'+day+'|'+time}function medActive(m,day=today()){return m.start<=day&&(!m.end||m.end>=day)&&m.status==='ativo'}
function timesFor(m){if(m.scheduleType==='interval'&&Number(m.interval)>0){let [hh,mm]=(m.firstTime||'08:00').split(':').map(Number),total=hh*60+mm;const arr=[];for(let i=0;i<24*60&&arr.length<24;i+=Number(m.interval)*60){const n=(total+i)%(24*60),t=pad(Math.floor(n/60))+':'+pad(n%60);if(!arr.includes(t))arr.push(t)}return arr.sort()}return [...new Set(String(m.times||'08:00').split(',').map(s=>s.trim()).filter(s=>/^([01]\d|2[0-3]):[0-5]\d$/.test(s)))].sort()}
function dosesFor(day){const out=[];for(const m of own(db.medications)){if(!medActive(m,day))continue;for(const time of timesFor(m)){const key=doseKey(m,day,time),record=db.doses[key];out.push({med:m,time,day,key,record,status:record?.status||'pendente'})}}return out.sort((a,b)=>a.time.localeCompare(b.time)||a.med.name.localeCompare(b.med.name))}
function statusChip(s){const a={agendada:['Agendada',''],concluida:['Concluída','success'],cancelada:['Cancelada','danger'],reagendada:['Reagendada','warning'],faltou:['Não compareceu','danger'],tomado:['Tomado','success'],pulou:['Não tomado','danger'],adiado:['Adiado','warning'],pendente:['Pendente','']};const [t,k]=a[s]||[s,''];return `<span class="chip ${k}">${E(t)}</span>`}
function appointmentItem(a,short=false){const d=doctor(a.doctorId);return `<div class="item"><div class="itemicon">${itemEmoji(a,"🩺")}</div><div class="itembody"><div class="itemtitle">${E(d?.name||a.doctorName||'Profissional não informado')}</div><div class="itemmeta">${E(d?.specialty||'Consulta')} • ${fmt(a.date,a.time)}${a.location?'<br>'+E(a.location):''}${a.reason?'<br>Motivo: '+E(a.reason):''}</div><div class="mt">${statusChip(a.status)}</div></div><div class="itemactions"><button class="btn ghost small" data-action="appt-detail" data-id="${a.id}">Detalhes</button>${!short&&a.status==='agendada'?`<button class="btn small" data-action="appt-complete" data-id="${a.id}">Concluir</button><button class="btn ghost small" data-action="appt-unmade" data-id="${a.id}">Não realizada</button>`:''}</div></div>`}
function doseItem(x){const {med:m,time,status,key,record}=x;const amount=(m.quantity?m.quantity+' ':'')+(m.unit||'');return `<div class="item"><div class="itemicon">${status==='tomado'?'✅':status==='pulou'?'⛔':E(m.emoji||'💊')}</div><div class="itembody"><div class="itemtitle">${E(time)} • ${E(m.name)}</div><div class="itemmeta">${E(amount)} ${m.strength?' • '+E(m.strength):''}${record?.actualAt?'<br>Registro: '+dtBR(record.actualAt):''}</div><div class="mt">${statusChip(status)}</div></div><div class="itemactions">${status!=='tomado'?`<button class="btn small" data-action="dose-take" data-key="${E(key)}">✓ Tomei</button>`:''}${status!=='pulou'?`<button class="btn ghost small" data-action="dose-skip" data-key="${E(key)}">Não tomei</button>`:''}${status==='pendente'?`<button class="btn ghost small" data-action="dose-delay" data-key="${E(key)}">Adiar</button>`:''}${status!=='pendente'?`<button class="btn ghost small" data-action="dose-reset" data-key="${E(key)}">Corrigir</button>`:''}</div></div>`}
function findDose(key){const [id,d,t]=String(key).split('|');const m=med(id);if(!m||m.profileId!==profile().id||!/^\d{4}-\d{2}-\d{2}$/.test(d)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(t))return null;return {m,d,t,key}}
function home(){const td=today(),doses=dosesFor(td),appointments=own(db.appointments).filter(a=>a.status==='agendada'&&(a.date>=td)).sort(apSort).slice(0,5),total=doses.length,done=doses.filter(x=>x.status==='tomado').length;return `<div class="banner"><h1>Olá, ${E(profile().name)}</h1><p>${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>${profile().name==='Meu perfil'?'<button class="btn ghost small mt" data-action="profile-setup">✏️ Cadastrar meu nome e emoji</button>':''}<div class="stats"><span>💊 ${done}/${total} doses registradas como tomadas</span><span>🩺 ${appointments.length} próxima(s) consulta(s) exibida(s)</span></div></div><div class="grid2"><div><div class="sectionhead"><h2>💊 Remédios de hoje</h2><button class="btn ghost small" data-go="medicamentos">Ver tratamentos →</button></div>${doses.length?doses.map(doseItem).join(''):'<div class="empty">Nenhum remédio programado para hoje. Adicione um tratamento para começar.</div>'}${total?`<div class="card"><div class="row between"><span class="small muted">Doses confirmadas hoje</span><strong>${done}/${total}</strong></div><div class="prog"><span style="width:${100*done/total}%"></span></div></div>`:''}</div><div><div class="sectionhead"><h2>🩺 Próximas consultas</h2><button class="btn ghost small" data-go="consultas">Ver consultas →</button></div>${appointments.length?appointments.map(a=>appointmentItem(a,true)).join(''):'<div class="empty">Nenhuma consulta futura agendada.</div>'}<div class="card home-actions"><h3>Acesso rápido</h3><div class="home-quick-grid"><button class="home-quick" data-go="calendario"><span>📅</span><strong>Calendário</strong><small>Ver sua agenda</small></button><button class="home-quick" data-go="historico"><span>🕘</span><strong>Histórico</strong><small>Ver registros</small></button><button class="home-quick" data-action="profiles"><span>👥</span><strong>Pessoas</strong><small>Trocar perfil</small></button></div></div></div></div><div class="subtle">Os horários e registros são organizativos. Não altere uma prescrição sem orientação profissional. Lembretes web funcionam apenas nas condições permitidas pelo navegador.</div>`}
function calendar(){const first=new Date(year,month,1),start=(first.getDay()+6)%7,days=new Date(year,month+1,0).getDate(),display=new Date(year,month,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});let cells='';for(let i=0;i<start;i++)cells+='<div></div>';for(let d=1;d<=days;d++){const day=year+'-'+pad(month+1)+'-'+pad(d),a=own(db.appointments).filter(x=>x.date===day&&x.status==='agendada').length,m=dosesFor(day).length;cells+=`<button class="day ${today()===day?'today':''} ${selectedDay===day?'selected':''}" data-action="calday" data-day="${day}"><span class="num">${d}</span><span class="dots">${a?'<i class="dot a"></i>':''}${m?'<i class="dot m"></i>':''}</span>${a+m?`<small class="muted tiny">${a+m}</small>`:''}</button>`}const aa=own(db.appointments).filter(a=>a.date===selectedDay).sort(apSort),dd=dosesFor(selectedDay);return `<div class="sectionhead"><div><h1 class="page-title">Calendário</h1><div class="page-sub">Ponto âmbar: consulta • azul: doses previstas</div></div><button class="btn ghost small" data-action="cal-today">Hoje</button></div><div class="card"><div class="calhead"><button class="btn ghost small" data-action="cal-prev">◀</button><h2 style="text-transform:capitalize;margin:0">${display}</h2><button class="btn ghost small" data-action="cal-next">▶</button></div><div class="calgrid">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div></div><div class="sectionhead"><h2>📍 ${dateBR(selectedDay)}</h2><div class="row wrap"><button class="btn ghost small" data-action="appt-new" data-date="${selectedDay}">＋ Consulta</button><button class="btn ghost small" data-action="med-new" data-date="${selectedDay}">＋ Remédio</button></div></div>${aa.map(x=>appointmentItem(x,true)).join('')}${dd.map(doseItem).join('')||(!aa.length?'<div class="empty">Sem compromissos ou doses previstos neste dia.</div>':'')}`}
function consultations(){const search=filters.consultas,q=low(search),future=own(db.appointments).filter(a=>a.status==='agendada'&&a.date>=today()).sort(apSort),past=own(db.appointments).filter(a=>!future.includes(a)).sort((a,b)=>apSort(b,a)),arr=tab.consultas==='futuras'?future:tab.consultas==='anteriores'?past:own(db.appointments).sort((a,b)=>apSort(b,a)),filtered=arr.filter(a=>low([doctor(a.doctorId)?.name,doctor(a.doctorId)?.specialty,a.reason,a.location,a.diagnosis,a.status].join(' ')).includes(q));return `<div class="sectionhead"><div><h1 class="page-title">Consultas e médicos</h1><div class="page-sub">Consultas vinculadas a profissionais, sem perder histórico.</div></div>${db.settings.consultPlusStyle==='title'?'<button class="btn" data-action="appt-new">＋ Consulta</button>':''}</div><div class="toolbar"><input id="searchAppt" aria-label="Buscar consultas" placeholder="Buscar médico, especialidade, motivo..." value="${E(search)}"><button class="btn ghost" data-go="cadastros">🗂️ Cadastros</button></div><div class="tabs">${[['futuras','Agendadas'],['anteriores','Histórico'],['todas','Todas']].map(([v,l])=>`<button class="tab ${tab.consultas===v?'active':''}" data-tab="consultas:${v}">${l}</button>`).join('')}</div>${filtered.length?filtered.map(a=>appointmentItem(a)).join(''):'<div class="empty">Nenhuma consulta encontrada. Use “＋ Consulta” para cadastrar.</div>'}`}
function medCard(m){const active=medActive(m),times=timesFor(m);const todayDoses=dosesFor(today()).filter(x=>x.med.id===m.id);const done=todayDoses.filter(x=>x.status==='tomado').length;return `<div class="item"><div class="itemicon">${itemEmoji(m,"💊")}</div><div class="itembody"><div class="itemtitle">${E(m.name)} ${m.strength?'• '+E(m.strength):''}</div><div class="itemmeta">${E(m.quantity||'1')} ${E(m.unit||'dose')} • ${times.join(' / ')}<br>${dateBR(m.start)} → ${m.end?dateBR(m.end):'Sem término definido'}${m.doctorId?'<br>Prescritor: '+E(doctor(m.doctorId)?.name||'Não informado'):''}${m.instructions?'<br>'+E(m.instructions):''}</div><div class="mt">${active?'<span class="chip success">Ativo</span>':'<span class="chip">Encerrado / fora do período</span>'}${active&&todayDoses.length?` <span class="chip">Hoje ${done}/${todayDoses.length}</span>`:''}${m.stock!==''&&m.stock!==undefined&&m.stockAlert!==''&&m.stockAlert!==undefined&&Number(m.stock)<=Number(m.stockAlert)?` <span class="chip warning">Estoque baixo: ${E(m.stock)} (conferir)</span>`:''}</div></div><div class="itemactions"><button class="btn ghost small" data-action="med-detail" data-id="${m.id}">Detalhes</button><button class="btn ghost small" data-action="med-edit" data-id="${m.id}">Editar</button>${m.status==='ativo'?`<button class="btn ghost small" data-action="med-end" data-id="${m.id}">Encerrar</button>`:''}</div></div>`}
function medications(){const search=filters.medicamentos,q=low(search);const arr=own(db.medications).filter(m=>tab.medicamentos==='todos'||(tab.medicamentos==='ativos'?medActive(m):!medActive(m))).filter(m=>low([m.name,m.strength,m.instructions,doctor(m.doctorId)?.name].join(' ')).includes(q)).sort((a,b)=>a.name.localeCompare(b.name));return `<div class="sectionhead"><div><h1 class="page-title">Medicamentos e tratamentos</h1><div class="page-sub">Guarde prescrições, horários e datas de início e término.</div></div>${db.settings.medPlusStyle==='title'?'<button class="btn" data-action="med-new">＋ Remédio</button>':''}</div><div class="toolbar"><input id="searchMed" aria-label="Buscar medicamentos" placeholder="Buscar medicamento ou prescritor..." value="${E(search)}"></div><div class="tabs">${[['ativos','Em tratamento'],['anteriores','Histórico'],['todos','Todos']].map(([v,l])=>`<button class="tab ${tab.medicamentos===v?'active':''}" data-tab="medicamentos:${v}">${l}</button>`).join('')}</div>${arr.length?arr.map(medCard).join(''):'<div class="empty">Nenhum remédio encontrado. Use “＋ Remédio” para cadastrar um tratamento.</div>'}`}

function cadItem(icon,name,meta,kind,id,action){return `<div class="item cadastro-item"><div class="itemicon">${E(icon)}</div><div class="itembody"><div class="itemtitle">${E(name)}</div><div class="itemmeta">${E(meta)}</div></div><div class="itemactions">${editCadastro?`<button class="btn ghost small" data-action="${action}-edit" data-id="${id}" aria-label="Editar">✏️</button><button class="btn ghost small danger-text" data-action="cad-delete" data-kind="${kind}" data-id="${id}" aria-label="Excluir">🗑️</button>`:`<button class="btn ghost small" data-action="${action}-detail" data-id="${id}">Abrir</button>`}</div></div>`}
function registrations(){const type=tab.cadastros,q=low(filters.cadastros),titles={medicos:['Profissionais','Médicos e outros profissionais de saúde'],remedios:['Remédios','Tratamentos cadastrados para a pessoa atual'],clinicas:['Clínicas e hospitais','Locais de atendimento e contatos'],pessoas:['Pessoas','Perfis de saúde deste dispositivo'],especialidades:['Especialidades','Especialidades para associar aos profissionais']};const [heading,subtitle]=titles[type]||titles.medicos;
const addAction={medicos:'doctor-new',remedios:'med-new',clinicas:'facility-new',pessoas:'profile-new',especialidades:'specialty-new'}[type];let arr='';
if(type==='medicos')arr=own(db.doctors).filter(d=>low([d.name,d.registry,specialistName(d),facilityName(d)].join(' ')).includes(q)).sort((a,b)=>a.name.localeCompare(b.name)).map(d=>cadItem(d.emoji||'🩺',d.name,`${specialistName(d)}${d.registry?' • CRM/registro '+d.registry:''}${facilityName(d)?' • '+facilityName(d):''}`,'doctor',d.id,'doctor')).join('');
if(type==='remedios')arr=own(db.medications).filter(m=>low([m.name,m.strength,m.reason].join(' ')).includes(q)).sort((a,b)=>a.name.localeCompare(b.name)).map(m=>cadItem(m.emoji||'💊',m.name,`${m.strength||'Apresentação não informada'} • ${dateBR(m.start)} a ${m.end?dateBR(m.end):'sem término'}`,'med',m.id,'med')).join('');
if(type==='clinicas')arr=own(db.facilities).filter(f=>low([f.name,f.type,f.address,f.city].join(' ')).includes(q)).sort((a,b)=>a.name.localeCompare(b.name)).map(f=>cadItem(f.emoji||'🏥',f.name,`${f.type||'Local de atendimento'}${f.city?' • '+f.city:''}${f.address?' • '+f.address:''}`,'facility',f.id,'facility')).join('');
if(type==='pessoas')arr=db.profiles.filter(p=>low(p.name).includes(q)).map(p=>cadItem(p.emoji||'👤',p.name,p.id===profile().id?'Perfil em uso':'Perfil disponível','profile',p.id,'profile')).join('');
if(type==='especialidades')arr=db.specialties.filter(s=>low(s.name).includes(q)).sort((a,b)=>a.name.localeCompare(b.name)).map(s=>cadItem(s.emoji||'🩺',s.name,`${db.doctors.filter(d=>d.specialtyId===s.id).length} profissional(is) cadastrado(s)`,'specialty',s.id,'specialty')).join('');
return `<div class="sectionhead"><div><h1 class="page-title">Cadastros</h1><div class="page-sub">Organize as informações utilizadas nas consultas e tratamentos.</div></div></div><div class="tabs">${[['medicos','🩺 Profissionais'],['remedios','💊 Remédios'],['clinicas','🏥 Clínicas'],['pessoas','👥 Pessoas'],['especialidades','📚 Especialidades']].map(([v,t])=>`<button class="tab ${v===type?'active':''}" data-tab="cadastros:${v}">${t}</button>`).join('')}</div><div class="sectionhead cadastro-head"><div><h2>${heading}</h2><p class="small muted" style="margin:0">${subtitle}</p></div><div class="row"><button class="btn ghost small ${editCadastro?'editing':''}" data-action="cad-edit-toggle" title="Ativar ou desativar edição">✏️ ${editCadastro?'Concluir':'Editar'}</button><button class="btn small" data-action="${addAction}">＋ Novo</button></div></div><div class="toolbar"><input id="searchCad" placeholder="Pesquisar em ${heading.toLocaleLowerCase('pt-BR')}" value="${E(filters.cadastros)}" aria-label="Pesquisar cadastros"></div>${arr||'<div class="empty">Nenhum registro encontrado. Toque em “＋ Novo” para adicionar.</div>'}<p class="small muted mt">Toque no lápis para mostrar as ações de edição e exclusão. Os registros já vinculados a históricos são protegidos contra exclusão acidental.</p>`}
function profileDetail(p){if(!p)return;modal('Pessoa cadastrada',`<div class="row mb"><div class="itemicon">${E(p.emoji||'👤')}</div><div><strong>${E(p.name)}</strong><div class="small muted">${p.id===profile().id?'Perfil em uso':'Perfil disponível'}</div></div></div><div class="modalfoot"><button class="btn ghost" data-action="close">Fechar</button><button class="btn" data-action="set-profile" data-id="${E(p.id)}">Abrir perfil</button></div>`)}
function specialtyForm(s){modal(s?'Editar especialidade':'Nova especialidade',`<form id="specialtyForm">${label('Especialidade *',inp('name',s?.name||'','text','required maxlength="100"'))}${emojiField(s?.emoji||'🩺')}<div class="modalfoot"><button type="button" class="btn ghost" data-action="close">Cancelar</button><button class="btn" type="submit">Salvar</button></div></form>`);$('#specialtyForm').onsubmit=e=>formsave(e,f=>{if(!f.name.trim())return toast('Informe a especialidade.',true);if(db.specialties.some(x=>x.id!==s?.id&&low(x.name)===low(f.name.trim())))return toast('Essa especialidade já está cadastrada.',true);if(s)Object.assign(s,{name:f.name.trim(),emoji:f.emoji||'🩺',updatedAt:nowIso()});else db.specialties.push({id:uid(),name:f.name.trim(),emoji:f.emoji||'🩺',createdAt:nowIso()});save();closeModal();render();toast('Especialidade salva.')})}
function specialtyDetail(s){modal(s.name,`<div class="row mb"><div class="itemicon">${E(s.emoji||'🩺')}</div><div><strong>${E(s.name)}</strong><p class="small muted">Especialidade médica</p></div></div><h3>Profissionais associados</h3>${db.doctors.filter(d=>d.specialtyId===s.id).map(d=>`<div class="item"><span>${E(d.emoji||'🩺')}</span><div class="itembody">${E(d.name)}</div></div>`).join('')||'<div class="empty">Nenhum profissional associado.</div>'}<div class="modalfoot"><button class="btn ghost" data-action="close">Fechar</button><button class="btn" data-action="specialty-edit" data-id="${s.id}">Editar</button></div>`)}
function facilityForm(f,resumeDoctor=null){const options=db.specialties.map(s=>`<label class="checkline" style="margin:3px 0"><input type="checkbox" name="specialtyIds" value="${E(s.id)}" ${f?.specialtyIds?.includes(s.id)?'checked':''}><span>${E(s.emoji||'🩺')} ${E(s.name)}</span></label>`).join('');modal(f?'Editar local de atendimento':'Novo local de atendimento',`<form id="facilityForm"><div class="formgrid">${label('Nome do hospital ou clínica *',inp('name',f?.name||'','text','required maxlength="140"'))}${label('Tipo',select('type',[['Hospital','Hospital'],['Clínica','Clínica'],['Consultório','Consultório'],['Posto de saúde','Posto de saúde'],['Laboratório','Laboratório'],['Outro','Outro']],f?.type||'Clínica'))}${label('Endereço',inp('address',f?.address||''),'full')}${label('Cidade',inp('city',f?.city||''))}${label('Estado / UF',inp('state',f?.state||''))}${label('Telefone',inp('phone',f?.phone||'','tel'))}${label('Site',inp('website',f?.website||'','url'))}${label('Observações',area('notes',f?.notes||''),'full')}</div><div class="small strong">Especialidades atendidas (opcional)</div><div class="specialty-grid">${options}</div>${emojiField(f?.emoji||'🏥')}<div class="modalfoot"><button type="button" class="btn ghost" data-action="${resumeDoctor?'doctor-form-resume':'close'}">${resumeDoctor?'Voltar ao médico':'Cancelar'}</button><button class="btn" type="submit">Salvar local</button></div></form>`);$('#facilityForm').onsubmit=e=>{e.preventDefault();const form=e.currentTarget,ff=Object.fromEntries(new FormData(form));if(!ff.name?.trim())return toast('Informe o nome do local.',true);ff.specialtyIds=new FormData(form).getAll('specialtyIds');ff.profileId=profile().id;let id=f?.id;if(f){Object.assign(f,ff,{updatedAt:nowIso()})}else{id=uid();db.facilities.push({id,...ff,createdAt:nowIso()})}save();if(resumeDoctor){doctorForm(resumeDoctor.original,{...resumeDoctor.fields,facilityId:id})}else{closeModal();render()}toast('Local de atendimento salvo.')}}
function facilityDetail(f){const ds=own(db.doctors).filter(d=>d.facilityId===f.id);modal(f.name,`<div class="row mb"><div class="itemicon">${E(f.emoji||'🏥')}</div><div><strong>${E(f.name)}</strong><div class="small muted">${E(f.type||'Local de atendimento')}</div></div></div><p class="small muted">${[f.address,f.city,f.state,f.phone,f.website].filter(Boolean).map(E).join(' • ')||'Contato e endereço não informados.'}</p>${f.notes?`<p>${E(f.notes)}</p>`:''}<h3>Especialidades atendidas</h3><p class="small muted">${(f.specialtyIds||[]).map(id=>specialty(id)?.name).filter(Boolean).map(E).join(' • ')||'Não informadas'}</p><h3>Profissionais deste local</h3>${ds.length?ds.map(d=>`<div class="item"><div class="itemicon">${E(d.emoji||'🩺')}</div><div class="itembody"><strong>${E(d.name)}</strong><div class="small muted">${E(specialistName(d))}</div></div><button class="btn ghost small" data-action="doctor-detail" data-id="${d.id}">Ver</button></div>`).join(''):'<div class="empty">Nenhum profissional associado.</div>'}<div class="modalfoot"><button class="btn ghost" data-action="close">Fechar</button><button class="btn" data-action="facility-edit" data-id="${f.id}">Editar</button></div>`)}
function deleteCadastro(kind,id){const d={doctor:db.doctors.find(x=>x.id===id),facility:facility(id),specialty:specialty(id),profile:db.profiles.find(x=>x.id===id),med:med(id)}[kind];if(!d)return;let refs=0;let msg='';if(kind==='doctor'){refs=db.appointments.filter(a=>a.doctorId===id).length+db.medications.filter(m=>m.doctorId===id).length;msg='Este profissional possui consultas ou tratamentos vinculados.'}if(kind==='facility'){refs=db.doctors.filter(x=>x.facilityId===id).length+db.appointments.filter(x=>x.facilityId===id).length;msg='Existem profissionais ou consultas associados a este local.'}if(kind==='specialty'){refs=db.doctors.filter(x=>x.specialtyId===id).length+(db.facilities||[]).filter(x=>(x.specialtyIds||[]).includes(id)).length;msg='Existem profissionais ou locais associados a esta especialidade.'}if(kind==='med'){refs=Object.keys(db.doses).filter(k=>k.startsWith(id+'|')).length;if(refs)return toast('Este tratamento possui doses registradas. Encerre o tratamento para preservar o histórico.',true)}if(kind==='profile'){if(db.profiles.length<=1)return toast('É necessário manter uma pessoa cadastrada.',true);return deleteProfile(id)}if(refs)return toast(msg+' Remova o vínculo antes de excluir.',true);const label={doctor:'profissional',med:'remédio e tratamento',facility:'local de atendimento',specialty:'especialidade'}[kind];confirmModal(`Excluir ${label}?`,`Deseja excluir “${d.name}”? Esta ação não pode ser desfeita sem backup.`,()=>{if(kind==='doctor')db.doctors=db.doctors.filter(x=>x.id!==id);if(kind==='med'){db.medications=db.medications.filter(x=>x.id!==id);for(const k of Object.keys(db.doses))if(k.startsWith(id+'|'))delete db.doses[k]}if(kind==='facility')db.facilities=db.facilities.filter(x=>x.id!==id);if(kind==='specialty')db.specialties=db.specialties.filter(x=>x.id!==id);log('data','Cadastro excluído',`${label}: ${d.name}`);save();closeModal();render();toast('Registro excluído.')})}

function information(){return `<div class="sectionhead"><div><h1 class="page-title">Informações</h1><div class="page-sub">Tudo o que você precisa saber para usar o MedicaAI.</div></div></div><div class="tabs"><button class="tab ${tab.info==='como'?'active':''}" data-tab="info:como">❓ Como funciona</button><button class="tab ${tab.info==='sobre'?'active':''}" data-tab="info:sobre">ℹ️ Sobre</button></div>${tab.info==='como'?`<div class="card">${[
['👥 Pessoas','Cadastre pessoas com nomes e emojis. Toque no nome e ícone no cabeçalho para trocar de pessoa. Cada perfil mantém seus registros separados.'],
['➕ Adicionar','Na tela Início, utilize o botão + para agendar uma consulta ou iniciar um tratamento. Personalize a posição e o formato desse botão em Configurações.'],
['🗂️ Cadastros','Gerencie profissionais, remédios, clínicas e hospitais, pessoas e especialidades. Use o lápis para editar ou excluir itens que não possuem vínculos protegidos.'],
['🩺 Consultas','Agende uma consulta vinculando um profissional e um local de atendimento. Registre o resultado ou marque como cancelada, não realizada ou reagendada.'],
['💊 Remédios','Cadastre tratamentos com começo, término, dose e horários fixos ou por intervalo. Registre se cada dose foi tomada, adiada ou não tomada.'],
['📅 Calendário','Navegue entre os meses. Selecione um dia e adicione uma consulta ou remédio com os botões correspondentes.'],
['🕘 Histórico','Consulte os acontecimentos guardados no seu perfil, incluindo alterações em consultas e tratamentos.'],
['🔔 Lembretes','Notificações do navegador exigem permissão e a página aberta. Não há garantia de lembretes quando o navegador ou aparelho suspende o aplicativo.'],
['🔗 Conexão','O aplicativo funciona sem login. Na tela Conexão é possível entrar com Google ou e-mail e escolher onde guardar seus registros. O envio e a recuperação de backups criptografados exigem ação explícita e uma senha de proteção.'],
['💾 Backups','Em Configurações, exporte seus registros ou importe um backup. Os arquivos JSON locais não são criptografados; armazene-os em local protegido.']
].map(([t,p])=>`<div class="helpblock"><h3>${t}</h3><p>${p}</p></div>`).join('')}</div>`:`<div class="card"><div class="row"><div class="appmark">✚</div><div><h2>MedicaAI</h2><div class="small muted">Versão 1.4 • 21/10/2026</div></div></div><p class="mt">Sua agenda pessoal de saúde: um lugar para organizar consultas, profissionais, estabelecimentos, tratamentos, horários e histórico das pessoas que você acompanha.</p><div class="subtle">O MedicaAI organiza registros fornecidos pelo usuário. Não diagnostica doenças nem orienta mudanças em prescrições. Os dados salvos no navegador não são criptografados. O armazenamento na nuvem é opcional. Backups criptografados exigem uma conta conectada e a senha de proteção escolhida por você.</div><h3 class="mt">Atualizações</h3><p class="small muted">Toque em uma versão para ler os detalhes.</p><details class="release-entry" data-panel="release-14"><summary><strong>1.4 — 21/10/2026</strong> <span class="release-arrow">⌄</span></summary><div class="release-body">Instalação PWA, ícones atualizados, ajustes no menu inferior, preferências dos painéis recolhíveis, tela Conexão simplificada, acesso com Google ou e-mail e backup criptografado em nuvem.</div></details><details class="release-entry" data-panel="release-13"><summary><strong>1.3 — 21/10/2026</strong><span class="release-arrow">⌄</span></summary><div class="release-body">Layout mais compacto nas telas e no calendário, cabeçalho mais próximo do conteúdo, opções de posição do botão Adicionar nas telas Início, Consultas e Remédios, ações de Cadastros alinhadas à direita e navegação Voltar com histórico de telas e abas, fechamento de modais e saída somente após dois Voltar no Início.</div></details><details class="release-entry" data-panel="release-12"><summary><strong>1.2 — 21/10/2026</strong><span class="release-arrow">⌄</span></summary><div class="release-body">Revisão visual de todas as telas: novo estilo padrão com cards harmonizados, abas integradas, navegação e formulários refinados, opção de voltar ao estilo clássico, logotipo como atalho ao Início e primeiro e último nomes completos no cabeçalho.</div></details><details class="release-entry" data-panel="release-11"><summary><strong>1.1 — 21/10/2026</strong><span class="release-arrow">⌄</span></summary><div class="release-body">Personalização do botão Adicionar, cabeçalho compacto com troca de pessoas, Cadastros com edição por lápis, clínicas e hospitais, especialidades médicas, escolha livre de emojis e aba Conexão independente. Melhorias em formulários e calendário.</div></details><details class="release-entry" data-panel="release-10"><summary><strong>1.0 — 21/10/2026</strong><span class="release-arrow">⌄</span></summary><div class="release-body">Primeira versão com pessoas, consultas, remédios, calendário, registros de doses, histórico, configurações, importação e exportação de dados.</div></details></div>`}`}
function profileForm(p){modal(p?'Editar pessoa':'Nova pessoa',`<form id="profileForm"><input type="hidden" name="id" value="${E(p?.id||'')}">${label('Nome completo *',inp('name',p?.name==='Meu perfil'?'':p?.name||'','text','required maxlength="70"'))}${emojiField(p?.emoji||'👤','pessoa')}<div class="modalfoot"><button type="button" class="btn ghost" data-action="close">Cancelar</button><button class="btn" type="submit">Salvar pessoa</button></div></form>`);$('#profileForm').onsubmit=e=>formsave(e,fd=>{if(!fd.name.trim())return toast('Informe um nome.',true);if(fd.id){const old=db.profiles.find(x=>x.id===fd.id);if(old)Object.assign(old,{name:fd.name.trim(),emoji:fd.emoji||'👤',updatedAt:nowIso()})}else{const id=uid();db.profiles.push({id,name:fd.name.trim(),emoji:fd.emoji||'👤',createdAt:nowIso()});db.activeProfileId=id}save();closeModal();render();$('#main').scrollTop=0;requestAnimationFrame(()=>{$('#main').scrollTop=0});toast('Pessoa salva.')})}
function profiles(){modal('Selecionar pessoa',`<div class="small muted mb">Toque em uma pessoa para abrir seus registros.</div><div class="profile-options">${db.profiles.map(p=>`<button type="button" class="profile-option ${p.id===profile().id?'active':''}" data-action="set-profile" data-id="${p.id}"><span>${E(p.name)}</span><span>${E(p.emoji||'👤')}</span></button>`).join('')}</div><button class="profile-add" data-action="profile-new">＋ Adicionar pessoa</button><div class="thin-line"></div><h3>Conexão e armazenamento</h3>${connectionSummary()}<div class="modalfoot"><button class="btn ghost small" data-go="conexao">Abrir Conexão →</button></div>`)}
function doctors(){tab.cadastros='medicos';go('cadastros')}
function doctorList(arr){if(!arr.length)return '<div class="empty">Nenhum profissional encontrado. Cadastre um para reutilizar em consultas.</div>';const now=today();const activeIds=new Set(own(db.appointments).filter(x=>x.status==='agendada'&&x.date>=now).map(x=>x.doctorId));const ordered=[...arr].sort((a,b)=>Number(activeIds.has(b.id))-Number(activeIds.has(a.id))||a.name.localeCompare(b.name));return `<h3>Consultas agendadas</h3>${ordered.filter(x=>activeIds.has(x.id)).map(doctorItem).join('')||'<div class="small muted mb">Sem médicos com consultas futuras.</div>'}<div class="thin-line"></div><h3>Demais profissionais / histórico</h3>${ordered.filter(x=>!activeIds.has(x.id)).map(doctorItem).join('')||'<div class="small muted">Nenhum profissional nesta seção.</div>'}`}
function doctorItem(d){const count=own(db.appointments).filter(x=>x.doctorId===d.id).length;return `<div class="item"><div class="itemicon">${itemEmoji(d,'🩺')}</div><div class="itembody"><div class="itemtitle">${E(d.name)}</div><div class="itemmeta">${E(specialistName(d))} • ${count} consulta(s)${facilityName(d)?'<br>'+E(facilityName(d)):''}${d.phone?'<br>'+E(d.phone):''}</div></div><div class="itemactions"><button class="btn ghost small" data-action="doctor-detail" data-id="${d.id}">Histórico</button><button class="btn ghost small" data-action="doctor-edit" data-id="${d.id}">Editar</button></div></div>`}
function doctorForm(d,draft=null){const o=draft||d||{},specs=db.specialties,fac=own(db.facilities);modal(d?'Editar profissional':'Novo profissional',`<form id="doctorForm"><input type="hidden" name="id" value="${E(d?.id||'')}"><div class="formgrid">${label('Nome do profissional *',inp('name',o.name||'','text','required maxlength="120"'))}${label('Registro / CRM',inp('registry',o.registry||''))}${label('Especialidade',select('specialtyId',[['','Não informada'],...specs.map(s=>[s.id,(s.emoji||'🩺')+' '+s.name])],o.specialtyId||''))}${label('Telefone',inp('phone',o.phone||'','tel'))}<div class="field full"><span>Hospital, clínica ou consultório</span><div class="inline-add">${select('facilityId',[['','Não informado'],...fac.map(f=>[f.id,(f.emoji||'🏥')+' '+f.name])],o.facilityId||'')}<button type="button" class="btn outline small" data-action="facility-from-doctor" title="Cadastrar novo local">＋ Novo local</button></div></div>${label('Observações',area('notes',o.notes||''),'full')}</div>${emojiField(o.emoji||'🩺')}<div class="modalfoot"><button type="button" class="btn ghost" data-action="close">Cancelar</button><button class="btn" type="submit">Salvar profissional</button></div></form>`);$('#doctorForm').onsubmit=e=>formsave(e,f=>{if(!f.name.trim())return toast('Informe o nome.',true);f.name=f.name.trim();f.specialty=specialty(f.specialtyId)?.name||'';f.clinic=facility(f.facilityId)?.name||'';if(d)Object.assign(d,{...f,updatedAt:nowIso()});else{delete f.id;db.doctors.push({id:uid(),profileId:profile().id,...f,createdAt:nowIso()})};save();closeModal();render();toast('Profissional salvo.')})}
function doctorDetail(d){const arr=own(db.appointments).filter(a=>a.doctorId===d.id).sort((a,b)=>apSort(b,a));modal(d.name,`<div class="row mb"><div class="itemicon">${itemEmoji(d,'🩺')}</div><div><strong>${E(d.name)}</strong><div class="small muted">${E(specialistName(d))}${d.registry?' • CRM/registro '+E(d.registry):''}</div></div></div><p class="small muted">${facilityName(d)?'🏥 '+E(facilityName(d))+'<br>':''}${d.phone?'☎ '+E(d.phone)+'<br>':''}${d.notes?E(d.notes):''}</p><h3>Consultas com este profissional</h3>${arr.length?arr.map(a=>`<div class="item"><div class="itembody"><strong>${fmt(a.date,a.time)}</strong> ${statusChip(a.status)}<div class="itemmeta">${E(a.reason||'Sem motivo informado')}${a.diagnosis?'<br>Relato médico: '+E(a.diagnosis):''}${a.certificateDays?'<br>Atestado: '+E(a.certificateDays)+' dia(s)':''}${a.prescription?'<br>Prescrição: '+E(a.prescription):''}</div></div><button class="btn ghost small" data-action="appt-detail" data-id="${a.id}">Abrir</button></div>`).join(''):'<div class="empty">Sem consultas cadastradas.</div>'}<div class="modalfoot"><button class="btn ghost" data-action="close">Fechar</button><button class="btn" data-action="appt-new" data-doctor="${d.id}">＋ Consulta</button></div>`)}
function appointmentForm(a,day='',preDoctor=''){const dId=a?.doctorId||preDoctor||'',ds=own(db.doctors),fs=own(db.facilities),now=new Date(),tm=pad(now.getHours())+':'+pad(now.getMinutes());modal(a?'Editar consulta':'Agendar consulta',`<form id="apptForm"><div class="formgrid">${label('Profissional',select('doctorId',[['','Não informado'],...ds.map(d=>[d.id,d.name+' — '+specialistName(d)])],dId))}${label('Data *',inp('date',a?.date||day||today(),'date','required'))}${label('Horário *',inp('time',a?.time||tm,'time','required'))}${label('Clínica ou hospital',select('facilityId',[['','Não informado'],...fs.map(f=>[f.id,f.name])],a?.facilityId||doctor(dId)?.facilityId||''))}${label('Local / sala (opcional)',inp('location',a?.location||''),'full')}${label('Motivo da consulta',area('reason',a?.reason||''),'full')}${label('Observações',area('notes',a?.notes||''),'full')}</div>${emojiField(a?.emoji||'🩺')}<div class="modalfoot"><button type="button" class="btn ghost" data-action="close">Cancelar</button><button class="btn" type="submit">Salvar consulta</button></div></form>`);$('#apptForm [name=doctorId]').onchange=e=>{const f=doctor(e.target.value),facilitySelect=$('#apptForm [name=facilityId]');if(f?.facilityId&&facilitySelect&&!facilitySelect.value)facilitySelect.value=f.facilityId};$('#apptForm').onsubmit=e=>formsave(e,f=>{if(!f.date||!f.time)return toast('Informe data e horário.',true);if(a){Object.assign(a,f,{updatedAt:nowIso()});log('appointment','Consulta atualizada',fmt(f.date,f.time))}else{db.appointments.push({id:uid(),profileId:profile().id,...f,status:'agendada',createdAt:nowIso(),changes:[]});log('appointment','Consulta agendada',`${doctor(f.doctorId)?.name||'Profissional não informado'} • ${fmt(f.date,f.time)}`)}save();closeModal();render();toast('Consulta salva.')})}
function appointmentDetail(a){const d=doctor(a.doctorId);modal('Detalhes da consulta',`<div class="card"><h2>${E(d?.name||'Profissional não informado')}</h2><div class="small muted">${E(d?.specialty||'Consulta')} • ${fmt(a.date,a.time)}${a.location?'<br>'+E(a.location):''}</div><div class="mt">${statusChip(a.status)}</div></div>${[
['Motivo',a.reason],['Observações',a.notes],['Causa / diagnóstico informado pelo médico',a.diagnosis],['Conduta / recomendações do médico',a.outcome],['Medicamentos receitados',a.prescription],['Exames solicitados',a.tests],['Atestado (dias)',a.certificateDays],['Início do atestado',a.certificateStart?dateBR(a.certificateStart):''],['Data de retorno',a.returnDate?dateBR(a.returnDate):''],['Motivo do cancelamento / ausência',a.statusReason]
].filter(x=>x[1]).map(([k,v])=>`<div class="helpblock"><strong>${E(k)}</strong><p>${E(v)}</p></div>`).join('')}${a.changes?.length?`<div class="helpblock"><h3>Histórico de mudanças</h3>${a.changes.map(c=>`<div class="small muted">${dtBR(c.at)} — ${E(c.text)}</div>`).join('')}</div>`:''}<div class="modalfoot">${a.status==='agendada'?`<button class="btn ghost small" data-action="appt-edit" data-id="${a.id}">Editar</button><button class="btn ghost small" data-action="appt-unmade" data-id="${a.id}">Não realizada</button><button class="btn small" data-action="appt-complete" data-id="${a.id}">Concluir</button>`:''}${a.status==='concluida'?`<button class="btn ghost" data-action="appt-complete" data-id="${a.id}">Editar conclusão</button>`:''}<button class="btn ghost" data-action="close">Fechar</button></div>`)}
function completeAppt(a){modal('Concluir consulta',`<p class="small muted">Salve o que realmente foi informado durante a consulta. Todos os campos abaixo são opcionais.</p><form id="completeForm"><div class="formgrid">${label('Causa ou diagnóstico informado pelo médico',area('diagnosis',a.diagnosis||''),'full')}${label('Orientações / resultados',area('outcome',a.outcome||''),'full')}${label('Medicamentos prescritos',area('prescription',a.prescription||''),'full')}${label('Exames solicitados',area('tests',a.tests||''),'full')}${label('Atestado: dias',inp('certificateDays',a.certificateDays||'','number','min="0" max="365"'))}${label('Início do atestado',inp('certificateStart',a.certificateStart||'','date'))}${label('Retorno previsto',inp('returnDate',a.returnDate||'','date'))}</div><div class="modalfoot"><button type="button" class="btn ghost" data-action="close">Cancelar</button><button class="btn" type="submit">Confirmar conclusão</button></div></form>`);$('#completeForm').onsubmit=e=>formsave(e,f=>{const editing=a.status==='concluida';Object.assign(a,f);a.status='concluida';a.completedAt=a.completedAt||nowIso();(a.changes??=[]).push({at:nowIso(),text:editing?'Informações da conclusão atualizadas':'Consulta concluída'});log('appointment','Conclusão registrada',`${doctor(a.doctorId)?.name||'Profissional'} • ${dateBR(a.date)}${f.diagnosis?' • '+f.diagnosis:''}`);save();closeModal();render();toast('Consulta concluída e adicionada ao histórico.');if(f.prescription)modal('Prescrição registrada',`<p>Deseja cadastrar agora os medicamentos deste atendimento? Você poderá vincular o médico e definir horários e duração.</p><div class="modalfoot"><button class="btn ghost" data-action="close">Depois</button><button class="btn" data-action="med-new" data-doctor="${a.doctorId||''}">Cadastrar medicamento</button></div>`)} )}
function unmadeAppt(a){modal('Consulta não realizada',`<p class="small muted">Selecione o que ocorreu. O registro anterior permanecerá no histórico.</p><form id="unmadeForm">${label('Situação',select('status',[['cancelada','Cancelada'],['reagendada','Reagendada'],['faltou','Não compareceu']],'reagendada'))}<div id="reschFields" class="formgrid">${label('Nova data',inp('newDate',a.date,'date'))}${label('Novo horário',inp('newTime',a.time,'time'))}</div>${label('Motivo (opcional)',area('reason',''))}<div class="modalfoot"><button type="button" class="btn ghost" data-action="close">Voltar</button><button class="btn" type="submit">Confirmar</button></div></form>`);const sel=$('#unmadeForm [name=status]');sel.onchange=()=>$('#reschFields').classList.toggle('hidden',sel.value!=='reagendada');$('#unmadeForm').onsubmit=e=>formsave(e,f=>{if(f.status==='reagendada'&&(!f.newDate||!f.newTime))return toast('Informe a nova data e hora.',true);const original=`${fmt(a.date,a.time)}`;(a.changes??=[]).push({at:nowIso(),text: f.status==='reagendada'?`Reagendada de ${original} para ${fmt(f.newDate,f.newTime)}${f.reason?' • '+f.reason:''}`:`${f.status==='cancelada'?'Cancelada':'Não compareceu'} • ${original}${f.reason?' • '+f.reason:''}`});if(f.status==='reagendada'){a.date=f.newDate;a.time=f.newTime;a.status='agendada'}else a.status=f.status;a.statusReason=f.reason;a.updatedAt=nowIso();log('appointment','Consulta '+(f.status==='reagendada'?'reagendada':f.status==='cancelada'?'cancelada':'não comparecida'),`${doctor(a.doctorId)?.name||'Profissional'} • ${original}${f.status==='reagendada'?' → '+fmt(f.newDate,f.newTime):''}`);save();closeModal();render();toast('Situação registrada.')})}
function medicationForm(m,preDoctor='',startDate=''){const ds=own(db.doctors);modal(m?'Editar tratamento':'Novo tratamento',`<form id="medForm"><div class="formgrid">${label('Medicamento *',inp('name',m?.name||'','text','required maxlength="140"'))}${label('Concentração / apresentação',inp('strength',m?.strength||'','text','placeholder="Ex.: 500 mg, comprimido"'))}${label('Quantidade por dose',inp('quantity',m?.quantity||'1','text','placeholder="Ex.: 1 ou 5"'))}${label('Unidade',select('unit',[['comprimido(s)','Comprimido(s)'],['cápsula(s)','Cápsula(s)'],['gota(s)','Gota(s)'],['mL','mL'],['dose(s)','Dose(s)'],['sachê(s)','Sachê(s)'],['outra unidade','Outra unidade']],m?.unit||'comprimido(s)'))}${label('Início *',inp('start',m?.start||startDate||today(),'date','required'))}${label('Término (opcional)',inp('end',m?.end||'','date'))}${label('Tipo de horário',select('scheduleType',[['fixed','Horários fixos'],['interval','Intervalo em horas']],m?.scheduleType||'fixed'))}${label('Horários (ex.: 00:00, 08:00, 16:00)',inp('times',m?.times||'08:00','text','placeholder="08:00, 16:00, 00:00"'),'timefixed')}${label('Intervalo (horas)',select('interval',[['4','4 em 4 horas'],['6','6 em 6 horas'],['8','8 em 8 horas'],['12','12 em 12 horas'],['24','24 em 24 horas']],m?.interval||'8'),'timeinterval')}${label('Primeiro horário',inp('firstTime',m?.firstTime||'08:00','time'),'timeinterval')}${label('Profissional que prescreveu',select('doctorId',[['','Não informado'],...ds.map(d=>[d.id,d.name])],m?.doctorId||preDoctor))}${label('Orientações da receita',area('instructions',m?.instructions||''),'full')}${label('Motivo do tratamento (opcional)',area('reason',m?.reason||''),'full')}${label('Estoque em unidades (opcional)',inp('stock',m?.stock??'','number','min="0" step="0.01"'))}${label('Avisar quando estoque chegar a',inp('stockAlert',m?.stockAlert??'','number','min="0" step="0.01"'))}</div>${emojiField(m?.emoji||'💊')}<div class="subtle mb">Confirme horários, doses e instruções conforme a prescrição. O estoque é preenchido manualmente e não é abatido automaticamente. Quando os horários mudarem, os registros anteriores permanecem no histórico, mas a programação passa a usar os novos horários.</div><div class="modalfoot"><button type="button" class="btn ghost" data-action="close">Cancelar</button><button type="submit" class="btn">Salvar tratamento</button></div></form>`);const type=$('#medForm [name=scheduleType]');const toggle=()=>{const isFixed=type.value==='fixed';$('#medForm .timefixed').classList.toggle('hidden',!isFixed);$$('#medForm .timeinterval').forEach(e=>e.classList.toggle('hidden',isFixed))};type.onchange=toggle;toggle();$('#medForm').onsubmit=e=>formsave(e,f=>{if(!f.name.trim()||!f.start)return toast('Preencha nome e início.',true);if(f.end&&f.end<f.start)return toast('O término não pode ser anterior ao início.',true);if(f.scheduleType==='fixed'){const ts=f.times.split(',').map(x=>x.trim());if(!ts.length||ts.some(x=>!/^([01]\d|2[0-3]):[0-5]\d$/.test(x)))return toast('Use horários HH:MM separados por vírgulas.',true)}if(m){Object.assign(m,f,{updatedAt:nowIso()});log('medication','Tratamento atualizado',m.name)}else{db.medications.push({id:uid(),profileId:profile().id,...f,status:'ativo',createdAt:nowIso()});log('medication','Tratamento iniciado',`${f.name} • ${dateBR(f.start)}${f.end?' até '+dateBR(f.end):''}`)}save();closeModal();render();toast('Tratamento salvo.')})}
function medDetail(m){const recorded=Object.entries(db.doses).filter(([key,v])=>key.startsWith(m.id+'|')&&v.status).map(([key,v])=>({key,day:key.split('|')[1],time:key.split('|')[2],...v})).sort((a,b)=>b.day.localeCompare(a.day)||b.time.localeCompare(a.time));modal('Tratamento — '+m.name,`<div class="subtle">${E(m.strength||'')} • ${E(m.quantity||'1')} ${E(m.unit||'dose')} • ${dateBR(m.start)} → ${m.end?dateBR(m.end):'Sem término'}<br>Horários: ${E(timesFor(m).join(' / '))}${m.doctorId?'<br>Prescritor: '+E(doctor(m.doctorId)?.name||'Não informado'):''}${m.reason?'<br>Motivo: '+E(m.reason):''}${m.instructions?'<br>Orientações: '+E(m.instructions):''}${m.stock!==''&&m.stock!==undefined?'<br>Estoque informado: '+E(m.stock):''}</div><h3 class="mt">Doses registradas (${recorded.length})</h3>${recorded.slice(0,150).map(r=>`<div class="item"><div class="itembody"><div class="itemtitle">${fmt(r.day,r.time)} ${statusChip(r.status)}</div><div class="itemmeta">${r.actualAt?'Registrado: '+dtBR(r.actualAt):''}${r.note?' • '+E(r.note):''}</div></div><button class="btn ghost small" data-action="dose-reset" data-key="${E(r.key)}">Corrigir</button></div>`).join('')||'<div class="empty">Nenhuma dose registrada até o momento.</div>'}${recorded.length>150?'<p class="small muted">Exibindo os 150 registros mais recentes. O backup preserva todos.</p>':''}<div class="modalfoot"><button class="btn ghost" data-action="med-edit" data-id="${m.id}">Editar</button><button class="btn ghost" data-action="close">Fechar</button></div>`)}
function markDose(key,status,note=''){const x=findDose(key);if(!x)return toast('Dose não encontrada no tratamento.',true);db.doses[key]={status,actualAt:nowIso(),note};log('dose',`${status==='tomado'?'Dose tomada':status==='pulou'?'Dose não tomada':'Dose adiada'}: ${x.m.name}`,`${fmt(x.d,x.t)}${note?' • '+note:''}`,x.m.profileId);/* O estoque é informativo e não é reduzido automaticamente: confirmações e correções não devem causar contagens falsas. */save();closeModal();render();toast('Registro de dose atualizado.')}
function confirmDose(key,status){const x=findDose(key);if(!x)return;modal(status==='tomado'?'Registrar dose tomada':status==='pulou'?'Registrar dose não tomada':'Adiar dose',`<p><strong>${E(x.m.name)}</strong> — ${fmt(x.d,x.t)}</p><form id="doseForm">${label(status==='adiado'?'Motivo do adiamento (opcional)':'Observação (opcional)',area('note',''))}<div class="modalfoot"><button type="button" class="btn ghost" data-action="close">Cancelar</button><button class="btn" type="submit">Confirmar</button></div></form>`);$('#doseForm').onsubmit=e=>formsave(e,f=>markDose(key,status,f.note||''))}

function cloudModes(){modal('Como você quer guardar seus dados?',`<p class="small muted">Escolha como deseja organizar seus dados após entrar na conta. Nesta versão, o envio à nuvem é manual e protegido por uma senha adicional; sua cópia local não será apagada.</p><div class="mode-list">${[['local','📱 Somente no aparelho','Sem enviar dados à nuvem.'],['cloud','☁️ Preferir a nuvem','Use backups na conta e mantenha uma cópia local.'],['both','🔄 Aparelho e nuvem','Trabalhe localmente e envie backups quando desejar.']].map(([v,t,d])=>`<button class="mode-option ${conn.mode===v?'selected':''}" data-action="choose-cloud-mode" data-mode="${v}"><strong>${t}</strong><span>${d}</span></button>`).join('')}</div><div class="modalfoot"><button class="btn ghost" data-action="close">Decidir depois</button></div>`)}
async function ensureFirebase(){if(cloudState.ready&&cloudState.api)return cloudState.api;if(!cloudConfig?.projectId)throw Error('O serviço de nuvem não está configurado.');if(cloudState.loading)throw Error('Aguarde a conexão ser preparada.');cloudState.loading=true;try{const ver='11.10.0';const [core,auth,fs]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${ver}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${ver}/firebase-auth.js`),import(`https://www.gstatic.com/firebasejs/${ver}/firebase-firestore.js`)]);const app=core.initializeApp(cloudConfig,'medicaai-main');const au=auth.getAuth(app),dbfs=fs.getFirestore(app);cloudState.api={auth,fs};cloudState.app=app;cloudState.auth=au;cloudState.firestore=dbfs;cloudState.ready=true;auth.onAuthStateChanged(au,u=>{const was=!!cloudState.user;cloudState.user=u;if(u){conn.uid=u.uid;storeConn();if(route==='conexao'){render();if(!was&&cloudState.promptAfterLogin==='google'){cloudState.promptAfterLogin=false;cloudModes()}}}else{cloudState.promptAfterLogin=false;conn.uid=null;conn.mode='local';storeConn();if(route==='conexao')render()}});return cloudState.api}catch(e){cloudState.ready=false;throw e}finally{cloudState.loading=false}}

function vaultModal(direction){if(!cloudState.user)return toast('Conecte sua conta para usar a nuvem.',true);modal(direction==='upload'?'Enviar backup criptografado':'Recuperar backup criptografado',`<form id="vaultForm"><p class="small muted">Informe a senha de proteção do seu cofre remoto (mínimo de 10 caracteres). Use a mesma senha quando quiser recuperar. Ela não será salva.</p>${label('Senha de proteção',inp('vaultPass','','password','required minlength="10" autocomplete="off"'))}${direction==='download'?`<label class="checkline"><input type="checkbox" name="replace" value="yes"> Substituir todos os registros locais pelos dados recuperados (caso contrário, mesclar)</label>`:''}<div class="subtle mb">${direction==='upload'?'O backup na nuvem será substituído pelo estado atual deste aplicativo, após criptografia.':'Se a senha estiver incorreta, o backup não poderá ser lido. Uma cópia local é feita antes de mesclar ou substituir, quando houver espaço.'}</div><div class="modalfoot"><button type="button" class="btn ghost" data-action="close">Cancelar</button><button class="btn" type="submit">${direction==='upload'?'Criptografar e enviar':'Recuperar dados'}</button></div></form>`);$('#vaultForm').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.currentTarget)),btn=$('#vaultForm [type=submit]');btn.disabled=true;cloudTransfer(direction,f.vaultPass,!!f.replace).finally(()=>{if(btn.isConnected)btn.disabled=false})}}
async function deriveAesKey(secret,salt){const imported=await crypto.subtle.importKey('raw',new TextEncoder().encode(secret),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},imported,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
const b64=x=>{let str='';for(let i=0;i<x.length;i+=8192)str+=String.fromCharCode(...x.subarray(i,i+8192));return btoa(str)};const unb64=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));
async function encryptVault(secret,obj){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveAesKey(secret,salt),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return {format:'MedicaAI-vault',v:1,kdf:'PBKDF2-SHA256-250000',cipher:'AES-GCM-256',salt:b64(salt),iv:b64(iv),data:b64(new Uint8Array(cipher)),updatedAt:nowIso()}}
async function decryptVault(secret,obj){if(obj?.format!=='MedicaAI-vault'||obj?.v!==1)throw Error('Formato remoto não reconhecido.');try{const key=await deriveAesKey(secret,unb64(obj.salt)),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(obj.iv)},key,unb64(obj.data));return validateImport(JSON.parse(new TextDecoder().decode(plain)))}catch{throw Error('Senha incorreta ou backup remoto corrompido.')}}
async function cloudTransfer(direction,secret,replace){if(!cloudState.user||!cloudState.ready)return toast('Conecte uma conta válida para continuar.',true);if(!crypto?.subtle)return toast('Criptografia indisponível. Utilize HTTPS ou localhost.',true);if(secret.length<10)return toast('Use uma senha de no mínimo 10 caracteres.',true);try{const {doc,getDoc,setDoc}=cloudState.api.fs,ref=doc(cloudState.firestore,'users',cloudState.user.uid,'medicaai','data');if(direction==='upload'){const payload=await encryptVault(secret,db);if(payload.data.length>750000)throw Error('Backup grande demais para um único documento Firestore. Exporte os dados localmente.');await setDoc(ref,{...payload});conn.lastCloud=nowIso();storeConn();closeModal();render();toast('Backup criptografado enviado com sucesso.')}else{const snap=await getDoc(ref);if(!snap.exists())return toast('Não foi encontrado backup nesta conta.',true);const incoming=await decryptVault(secret,snap.data());window.__medImport=incoming;localStorage.setItem(BACKUP,JSON.stringify(db));if(replace){const before=db;db=incoming;db.settings={...emptyDB().settings,...db.settings};if(!save()){db=before;throw Error('Não foi possível salvar os dados recuperados.')}}else{mergeImported(incoming)}conn.lastCloud=nowIso();storeConn();closeModal();render();toast('Dados remotos recuperados e aplicados.')}}catch(e){toast('Operação não concluída: '+cloudError(e),true)}}
function mergeImported(incoming){const merged={...db,profiles:mergeCollection(db.profiles,incoming.profiles),doctors:mergeCollection(db.doctors,incoming.doctors),appointments:mergeCollection(db.appointments,incoming.appointments),medications:mergeCollection(db.medications,incoming.medications),facilities:mergeCollection(db.facilities,incoming.facilities||[]),specialties:mergeCollection(db.specialties,incoming.specialties||[]),events:mergeCollection(db.events,incoming.events),doses:{...db.doses}};for(const [key,v] of Object.entries(incoming.doses)){const cur=merged.doses[key];if(!cur||String(v?.actualAt||'')>String(cur.actualAt||''))merged.doses[key]=v}db=merged;save()}

function exportFile(blob,name){const link=document.createElement('a'),url=URL.createObjectURL(blob);link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function csvCell(s){const x=String(s??'');return '"'+x.replace(/"/g,'""')+'"'}function exportCSV(){const rows=[['Pessoa','Medicamento','Concentração','Quantidade','Unidade','Início','Término','Horários','Estado']];for(const m of db.medications)rows.push([db.profiles.find(x=>x.id===m.profileId)?.name||'',m.name,m.strength,m.quantity,m.unit,m.start,m.end,timesFor(m).join(' / '),m.status]);exportFile(new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'MedicaAI_tratamentos_'+today()+'.csv')}
function validateImport(payload){const data=payload?.format==='MedicaAI'?payload.data:payload;if(!data||!Array.isArray(data.profiles)||!Array.isArray(data.doctors)||!Array.isArray(data.appointments)||!Array.isArray(data.medications)||typeof data.doses!=='object'||data.doses===null||!Array.isArray(data.events)||!data.settings||data.profiles.length<1||data.profiles.length>1000)throw Error('Arquivo não é um backup MedicaAI válido.');data.facilities=Array.isArray(data.facilities)?data.facilities:[];data.specialties=Array.isArray(data.specialties)?data.specialties:DEFAULT_SPECIALTIES.map(([name,emoji])=>({id:uid(),name,emoji}));return data}
function importPreview(data){modal('Importar dados',`<p>Backup encontrado com <strong>${data.profiles.length} pessoa(s)</strong>, <strong>${data.appointments.length} consulta(s)</strong> e <strong>${data.medications.length} tratamento(s)</strong>.</p><div class="subtle mb">Será criada uma cópia local dos dados anteriores, se houver espaço. Mesclar conserva registros distintos pelo identificador e prioriza registros com carimbo de alteração mais recente. Para evitar conflito entre doses, entradas com a mesma chave usam o registro de data mais recente.</div><div class="modalfoot"><button class="btn ghost" data-action="close">Cancelar</button><button class="btn ghost" data-action="import-merge">Misturar</button><button class="btn danger" data-action="import-replace">Substituir</button></div>`);window.__medImport=data}
function mergeCollection(current,incoming){const map=new Map(current.map(x=>[x.id,x]));for(const x of incoming){if(!x||!x.id)continue;const prev=map.get(x.id);if(!prev||String(x.updatedAt||x.createdAt||'')>String(prev.updatedAt||prev.createdAt||''))map.set(x.id,x)}return [...map.values()]}
function doImport(mode){const incoming=window.__medImport;if(!incoming)return;try{localStorage.setItem(BACKUP,JSON.stringify(db));let res;if(mode==='replace'){res=incoming}else{res={...db,profiles:mergeCollection(db.profiles,incoming.profiles),doctors:mergeCollection(db.doctors,incoming.doctors),appointments:mergeCollection(db.appointments,incoming.appointments),medications:mergeCollection(db.medications,incoming.medications),facilities:mergeCollection(db.facilities,incoming.facilities),specialties:mergeCollection(db.specialties,incoming.specialties),events:mergeCollection(db.events,incoming.events),doses:{...db.doses}};for(const [key,v] of Object.entries(incoming.doses)){const cur=res.doses[key];if(!cur||String(v?.actualAt||'')>String(cur.actualAt||''))res.doses[key]=v}}db=res;if(!db.profiles.some(p=>p.id===db.activeProfileId))db.activeProfileId=db.profiles[0].id;if(!save())throw Error('Falha ao salvar backup importado');closeModal();go('inicio');toast('Dados importados.')}catch(e){try{db=JSON.parse(localStorage.getItem(BACKUP));save()}catch{}toast('Importação não concluída: '+e.message,true)}finally{window.__medImport=null}}
function restore(){const str=localStorage.getItem(BACKUP);if(!str)return toast('Não há backup anterior à importação.',true);confirmModal('Restaurar dados?', 'A restauração substitui os dados atuais pela cópia anterior à última importação.',()=>{try{db=validateImport(JSON.parse(str));save();closeModal();render();toast('Dados anteriores restaurados.')}catch(e){toast(e.message,true)}})}

function clearProfile(){confirmModal('Limpar dados desta pessoa?',`Serão apagados consultas, médicos, medicamentos, histórico e doses de ${profile().name}. Exporte um backup antes.`,()=>{const id=profile().id,medIds=new Set(db.medications.filter(m=>m.profileId===id).map(m=>m.id));for(const k of Object.keys(db.doses))if(medIds.has(k.split('|')[0]))delete db.doses[k];for(const k of ['appointments','doctors','medications','events','facilities'])db[k]=db[k].filter(x=>x.profileId!==id);save();closeModal();go('inicio');toast('Dados deste perfil limpos.')})}

function deleteProfile(id){if(db.profiles.length<=1)return toast('Mantenha ao menos uma pessoa.',true);const p=db.profiles.find(x=>x.id===id);if(!p)return;confirmModal('Excluir pessoa?',`Excluir ${p.name} e todos os seus registros locais? Esta operação não pode ser desfeita sem backup.`,()=>{const medIds=new Set(db.medications.filter(m=>m.profileId===id).map(m=>m.id));db.profiles=db.profiles.filter(p=>p.id!==id);for(const k of ['doctors','appointments','medications','events','facilities'])db[k]=db[k].filter(x=>x.profileId!==id);for(const k of Object.keys(db.doses))if(medIds.has(k.split('|')[0]))delete db.doses[k];if(db.activeProfileId===id)db.activeProfileId=db.profiles[0].id;save();closeModal();render();toast('Pessoa e registros excluídos.')})}

function requestNotification(test=false){if(!('Notification' in window))return toast('Este navegador não oferece notificações.',true);if(!isSecureContext)return toast('Notificações exigem HTTPS ou localhost. No arquivo local podem não funcionar.',true);Notification.requestPermission().then(p=>{if(p==='granted'){db.settings.notification=true;save();render();if(test)new Notification('MedicaAI',{body:db.settings.privateNotification?'Teste de lembrete.':'Notificações ativadas.'});toast('Permissão concedida. Alertas são tentados somente com a página aberta.')}else{db.settings.notification=false;save();render();toast('Permissão não concedida.',true)}}).catch(()=>toast('Não foi possível pedir permissão.',true))}
const notified=new Set();function checkNotifications(){if(!db.settings.notification||!('Notification' in window)||Notification.permission!=='granted'||document.hidden)return;const t=new Date(),d=localDay(t),minutes=t.getHours()*60+t.getMinutes();for(const dose of dosesFor(d)){const [h,m]=dose.time.split(':').map(Number),when=h*60+m;if(minutes<when||minutes>when+1||dose.record||notified.has(dose.key))continue;notified.add(dose.key);try{new Notification('MedicaAI • Lembrete',{body:db.settings.privateNotification?'Você tem um medicamento programado.':`Hora de ${dose.med.name} (${dose.time})`,tag:'medicaai-'+dose.key})}catch{} }if(notified.size>500)notified.clear()}

case 'dose-take':confirmDose(key,'tomado');break;case 'dose-skip':confirmDose(key,'pulou');break;case 'dose-delay':confirmDose(key,'adiado');break;case 'dose-reset':{const x=findDose(key);if(!x)return;confirmModal('Corrigir registro?',`Remover a confirmação anterior de ${x.m.name} (${fmt(x.d,x.t)})?`,()=>{delete db.doses[key];log('dose','Registro de dose corrigido',`${x.m.name} • ${fmt(x.d,x.t)}`);save();closeModal();render();toast('Registro removido.')});break}
case 'cal-prev':month--;if(month<0){month=11;year--}selectedDay=year+'-'+pad(month+1)+'-01';render();break;case 'cal-next':month++;if(month>11){month=0;year++}selectedDay=year+'-'+pad(month+1)+'-01';render();break;case 'cal-today':month=new Date().getMonth();year=new Date().getFullYear();selectedDay=today();render();break;case 'calday':selectedDay=el.dataset.day;render();break;
case 'nav-up':moveNav(id,-1);break;case 'nav-down':moveNav(id,1);break;case 'save-device':{const x=$('[name=deviceName]');db.settings.deviceName=x?.value.trim().slice(0,60)||'Este dispositivo';save();render();toast('Apelido salvo.');break}
case 'cloud':cloud();break;case 'cloud-mode':cloudModes();break;case 'choose-cloud-mode':if(!cloudState.user&&el.dataset.mode!=='local'){toast('Conecte uma conta para escolher a nuvem.',true);break}conn.mode=el.dataset.mode;storeConn();closeModal();render();toast('Preferência de armazenamento atualizada.');break;
case 'install-pwa':if(installPrompt){const p=installPrompt;installPrompt=null;p.prompt();p.userChoice.then(()=>{if(route==='config')render()});}break;case 'firebase-google':firebaseLoginGoogle();break;case 'firebase-reset-email':resetEmailPassword();break;case 'firebase-email':firebaseEmailModal();break;case 'firebase-create-email':firebaseLoginEmail(true);break;case 'firebase-logout':firebaseLogout();break;
case 'cloud-upload':vaultModal('upload');break;case 'cloud-download':vaultModal('download');break;case 'test-notification':requestNotification(true);break;case 'export':exportJSON();break;case 'export-csv':exportCSV();break;case 'import':$('#importFile').click();break;case 'import-merge':doImport('merge');break;case 'import-replace':doImport('replace');break;case 'restore':restore();break;case 'clear-profile':clearProfile();break;case 'clear-all':clearAll();break;default:break}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-go]');if(nav){go(nav.dataset.go);return}const tabEl=e.target.closest('[data-tab]');if(tabEl){const [k,v]=tabEl.dataset.tab.split(':');changeTab(k,v);return}const b=e.target.closest('[data-action]');if(b){e.preventDefault();action(b.dataset.action,b)}});
$('#backdrop').onclick=()=>showMenu(false);$('#modalWrap').addEventListener('click',e=>{if(e.target===$('#modalWrap'))closeModal()});
document.addEventListener('change',e=>{const x=e.target;if(!x.matches('[data-setting]'))return;const key=x.dataset.setting,val=x.type==='checkbox'?x.checked:x.value;db.settings[key]=val;save();if(key==='notification'&&val)requestNotification();else render()});
let searchTimer=null;document.addEventListener('input',e=>{if(e.target.matches('[data-custom-emoji]')){const box=e.target.closest('.emoji-field');if(box){box.querySelector('[name=emoji]').value=e.target.value.trim()||'🩺';refreshEmojiField(box)}}const id=e.target.id,k={searchAppt:'consultas',searchMed:'medicamentos',searchHistory:'historico',searchCad:'cadastros'}[id];if(k){filters[k]=e.target.value;const pos=e.target.selectionStart;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{if(route!==({consultas:'consultas',medicamentos:'medicamentos',historico:'historico',cadastros:'cadastros'}[k]))return;render();const el=document.getElementById(id);if(el){el.focus({preventScroll:true});el.setSelectionRange(pos,pos)}},160)}if(id==='doctorSearch'){const q=low(e.target.value);$('#doctorList').innerHTML=doctorList(own(db.doctors).filter(d=>low(d.name+' '+d.specialty+' '+d.clinic).includes(q)))}});

$('#importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;e.target.value='';if(f.size>10*1024*1024)return toast('Backup maior que 10 MB. Importe um arquivo menor.',true);try{const data=validateImport(JSON.parse(await f.text()));importPreview(data)}catch(err){toast('Arquivo inválido: '+err.message,true)}});
let touch=null;const blockedTarget=el=>!!el.closest('input,textarea,select,button,a,.tabs,.calgrid,.modalwrap,.sidebar,.navlist,.toolbar');document.addEventListener('touchstart',e=>{if(!db.settings.swipe||e.touches.length!==1||blockedTarget(e.target))return;touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});document.addEventListener('touchend',e=>{if(!touch||!db.settings.swipe||e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)<90||Math.abs(dx)<Math.abs(dy)*1.5)return;const list=orderedNav().map(n=>n[0]),i=list.indexOf(route),n=i+(dx<0?1:-1);if(n>=0&&n<list.length)go(list[n])},{passive:true});document.addEventListener('touchcancel',()=>touch=null,{passive:true});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();if(!back())toast('Você está na tela inicial. Pressione Voltar duas vezes no Android para sair.')}});
// Uma entrada sentinela mantém o Voltar do Android dentro do aplicativo.
// Cada ação fecha a camada aberta ou retorna à última tela/aba visitada.
// Somente dois Voltar consecutivos no Início, sem histórico interno, permitem a saída.
try{history.replaceState({medicaaiRoot:true},'',location.href);history.pushState({medicaaiGuard:true},'',location.href);window.addEventListener('popstate',()=>{if(back()){lastBackPress=0;history.pushState({medicaaiGuard:true},'',location.href);return}const t=Date.now();if(t-lastBackPress<2200){lastBackPress=0;history.back();return}lastBackPress=t;toast('Pressione Voltar novamente para sair.');history.pushState({medicaaiGuard:true},'',location.href)})}catch{}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(route==='config')render()});
window.addEventListener('appinstalled',()=>{installPrompt=null;if(route==='config')render();toast('MedicaAI instalado com sucesso.')} );
if('serviceWorker' in navigator&&['https:','http:'].includes(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(err=>console.warn('Instalação offline não disponível:',err.message)));
try{const mq=matchMedia('(prefers-color-scheme: dark)');mq.addEventListener('change',()=>{if(db.settings.theme==='system')applySettings()})}catch{}
render();if(cloudConfig?.projectId&&location.protocol!=='file:'){ensureFirebase().catch(e=>console.warn('Firebase inativo:',e.message))}tick=setInterval(checkNotifications,30000);checkNotifications();
})();
